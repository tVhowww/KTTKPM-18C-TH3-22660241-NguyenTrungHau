server:
  port: 8084

spring:
  application:
    name: inventory-service
  data:
    redis:
      host: 192.168.1.69
      port: 6379

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://192.168.1.82:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: "*" # Cho phép Dashboard quét dữ liệu
  endpoint:
    health:
      show-details: always